general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(31, 31, 40)
}

input-field {
    monitor =
    size = 260, 40
    outline_thickness = 1
    rounding = 0
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(84, 84, 109)
    inner_color = rgb(42, 42, 55)
    font_color = rgb(220, 215, 186)
    check_color = rgb(230, 195, 132)
    fail_color = rgb(232, 36, 36)
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(220, 215, 186)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}
