# шрифт и отступы
font_family      JetBrainsMono Nerd Font
font_size        13.0
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
shell zsh


# прозрачность (блюр рисует Hyprland)
background_opacity 0.85
dynamic_background_opacity no

# курсор и выделение
cursor_shape block
cursor            #a47fe0
cursor_text_color #0b0b0b
selection_foreground #0b0b0b
selection_background #a47fe0

# цвета
background #0b0b0b
foreground #a47fe0

color0  #1a1a1a
color1  #c34043
color2  #76946a
color3  #c0a36e
color4  #7e9cd8
color5  #a47fe0
color6  #6a9589
color7  #c7bfac
color8  #5c5c55
color9  #e82424
color10 #98bb6c
color11 #e6c384
color12 #7fb4ca
color13 #c4a7f5
color14 #7aa89f
color15 #ece6d0

# табы (если захочешь) без украшений
tab_bar_style hidden
