
# ==========================================
# MangoWC 0.18.6-1
# ==========================================

# NVIDIA / Cursor
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=XCURSOR_THEME,breeze_cursors
env=XCURSOR_SIZE,24
env=HYPRCURSOR_SIZE,24

# ==========================================
# MONITORS
# ==========================================

monitor_rule=name:^DP-1$,width:1920,height:1080,refresh:60,x:0,y:0,scale:1
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:1920,y:0,scale:1

# ==========================================
# AUTOSTART
# ==========================================

exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec_once=awww-daemon
exec_once=/home/ult/.local/bin/start-audio
exec_once=sh -c 'until python /home/ult/distro-rpc.py; do sleep 10; done'
exec_once=waybar
exec_once=mako

# ==========================================
# KEYBOARD
# ==========================================

xkb_rules_layout=us,ru
xkb_rules_options=grp:alt_shift_toggle

# ==========================================
# GAPS
# ==========================================

gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10

# ==========================================
# COLORS / BORDERS
# ==========================================

border_px=0
border_color=0x414b50ff
focus_color=0x63008dff
root_color=0x000000ff

border_radius=12

# ==========================================
# EFFECTS
# ==========================================

blur=0
blur_layer=0

dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x0000001f

# ==========================================
# ANIMATIONS
# ==========================================

animations=1
layer_animations=1

animation_type_open=zoom
animation_type_close=zoom

animation_fade_in=1
animation_fade_out=1

animation_duration_move=380
animation_duration_open=290
animation_duration_close=400
animation_duration_tag=350
animation_duration_focus=210

animation_curve_open=0.16,1.0,0.3,1.0
animation_curve_move=0.12,0.9,0.2,1.0
animation_curve_tag=0.22,1.0,0.36,1.0
animation_curve_close=0.55,0.085,0.68,0.53
animation_curve_focus=0.25,0.46,0.45,0.94

# ==========================================
# TAGS
# ==========================================

tag_num=6

tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile

# ==========================================
# WINDOW RULES
# ==========================================

# ==========================================
# ROFI ANIMATIONS
# ==========================================

layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi

# ==========================================
# APPLICATIONS
# ==========================================

bind=SUPER,q,spawn,kitty
bind=SUPER,e,spawn,ski
bind=SUPER,r,spawn,rofi -show drun
bind=SUPER,l,spawn,hyprlock
bind=SUPER,w,spawn,rofi -show power

# ==========================================
# SCREENSHOT
# ==========================================

bind=SUPER+SHIFT,s,spawn_shell,g=$(slurp) && grim -g "$g" - | wl-copy

# ==========================================
# WINDOW MANAGEMENT
# ==========================================

bind=SUPER,c,killclient
bind=SUPER,f,togglefullscreen

# ==========================================
# FOCUS
# ==========================================

bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down

# ==========================================
# MOVE WINDOWS
# ==========================================

bind=SUPER+SHIFT,left,move_client,left
bind=SUPER+SHIFT,right,move_client,right
bind=SUPER+SHIFT,up,move_client,up
bind=SUPER+SHIFT,down,move_client,down

# ==========================================
# SWITCH TAGS
# ==========================================

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0

# ==========================================
# MOVE WINDOWS TO TAGS
# ==========================================

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0

# ==========================================
# RELOAD CONFIG
# ==========================================

bind=SUPER+SHIFT,r,reload_config

# ==========================================
# MOUSE
# ==========================================

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# ==========================================
# AUDIO
# ==========================================

bindl=NONE,XF86AudioRaiseVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ +5%
bindl=NONE,XF86AudioLowerVolume,spawn,pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl=NONE,XF86AudioMute,spawn,pactl set-sink-mute @DEFAULT_SINK@ toggle
